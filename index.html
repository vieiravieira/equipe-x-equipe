<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equipe x Equipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0A0A0F;--card:#16161F;--card2:#20202C;--linha:#2A2A38;--txt:#fff;--sub:#B8B8C8;--a:#3DDC84;--b:#FF8A3D;--am:#FFD60A;--rosa:#FF2E88;--ok:#3DDC84}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;transition:background .5s}
body.modo-desafio{background:radial-gradient(circle at 50% 45%,#4A0A2A 0%,#14040C 75%)}
.bung{font-family:Bungee,Impact,sans-serif;font-weight:400}
button{font-family:inherit}
.btn{border:0;cursor:pointer;border-radius:14px;padding:14px 24px;font-weight:800;font-size:17px;background:var(--am);color:#0A0A0F;min-height:48px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{background:var(--card2);color:#fff;border:2px solid var(--linha)}
.btn.verde{background:var(--ok)}
.btn.rosa{background:var(--rosa)}
input,select,textarea{font-family:inherit;background:var(--bg);border:2px solid var(--linha);border-radius:12px;padding:12px 14px;color:#fff;font-size:16px;width:100%}
label{font-size:13px;font-weight:600;color:var(--sub);letter-spacing:1px}
.erro{background:#3A0D16;border:2px solid #FF4D6D;color:#FFC2CE;border-radius:12px;padding:12px 16px;font-weight:600}
.pisca{animation:piscaTxt 1s ease-in-out infinite}
@keyframes piscaTxt{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.12)}}
@keyframes gira{to{transform:rotate(360deg)}}
.raios{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(rgba(255,214,10,.18) 0deg 10deg,transparent 10deg 20deg);animation:gira 14s linear infinite}
.modo-desafio .raios{background:repeating-conic-gradient(rgba(255,46,136,.35) 0deg 8deg,transparent 8deg 16deg);animation-duration:7s}

/* ---------- AVATARES ---------- */
.av{width:var(--t,20vh);height:var(--t,20vh);position:relative;transition:width .9s cubic-bezier(.34,1.56,.64,1),height .9s cubic-bezier(.34,1.56,.64,1)}
.av svg{width:100%;height:100%;overflow:visible;display:block}
.av .ritmo{width:100%;height:100%;animation:ritmo .9s ease-in-out infinite alternate;transform-origin:50% 90%}
@keyframes ritmo{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.av .corpo{width:100%;height:100%;animation:respira 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes respira{0%,100%{transform:scale(1,1)}50%{transform:scale(1.035,.965)}}
.av svg g{transform-box:fill-box;transform-origin:center}
.av .p-olhos{animation:piscaOlho 4.2s infinite}
@keyframes piscaOlho{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.av .oe{transform-origin:right bottom;animation:orelhaE 3.6s infinite}
.av .od{transform-origin:left bottom;animation:orelhaD 3.6s 1.7s infinite}
@keyframes orelhaE{0%,86%,100%{transform:rotate(0)}91%{transform:rotate(-14deg)}96%{transform:rotate(6deg)}}
@keyframes orelhaD{0%,86%,100%{transform:rotate(0)}91%{transform:rotate(14deg)}96%{transform:rotate(-6deg)}}
.av.encarando .p-sobr{animation:provoca 1.6s infinite}
@keyframes provoca{0%,60%,100%{transform:translateY(0)}68%{transform:translateY(-8px)}76%{transform:translateY(0)}84%{transform:translateY(-6px)}}
.av.encarando .p-boca{animation:rosna 3.4s infinite}
@keyframes rosna{0%,78%,100%{transform:scale(1)}84%,92%{transform:scale(1.3,1.55)}}
.av.nervoso .corpo{animation:treme .13s linear infinite}
@keyframes treme{0%,100%{transform:translateX(0)}25%{transform:translateX(-3%)}75%{transform:translateX(3%)}}
.av.feliz{animation:pulo .7s ease-out 3}
.av.festa{animation:pulo 1.1s ease-in-out infinite}
@keyframes pulo{0%,100%{transform:translateY(0)}40%{transform:translateY(-18%) scale(1.06)}70%{transform:translateY(0) scale(1.08,.92)}}
.av.feliz .p-olhos,.av.festa .p-olhos{animation:none;transform:scaleY(.25)}
.av.feliz .p-boca,.av.festa .p-boca{transform:scale(1.25,1.4)}
.av.triste{animation:nao .45s ease-in-out 4}
@keyframes nao{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.av.triste .p-sobr{transform:translateY(-7px) scaleX(.9)}
.av.triste .p-boca{transform:scale(.7,.5)}
.av.ri .corpo{animation:ri .22s ease-in-out infinite}
@keyframes ri{0%,100%{transform:translateY(0)}50%{transform:translateY(-5%)}}
.av.ri .p-boca{transform:scale(1.4,1.7)}
.av.ri .p-olhos{animation:none;transform:scaleY(.3)}
.av.susto{animation:susto .5s ease-out 1}
@keyframes susto{0%,100%{transform:translateY(0)}30%{transform:translateY(-12%)}}
.av.susto .p-olhos{animation:none;transform:scale(1.45)}
.av .fx-estrelas,.av .fx-gota,.av .fx-exc{display:none;position:absolute;pointer-events:none;z-index:2}
.av.feliz .fx-estrelas,.av.festa .fx-estrelas{display:block}
.av.triste .fx-gota,.av.nervoso .fx-gota{display:block}
.av.susto .fx-exc{display:block}
.fx-estrelas{inset:-18%}
.fx-estrelas i{position:absolute;width:18%;height:18%;animation:brilha 1s ease-in-out infinite}
.fx-estrelas i svg{width:100%;height:100%}
.fx-estrelas .s1{left:0;top:10%}.fx-estrelas .s2{right:0;top:0;animation-delay:.25s}.fx-estrelas .s3{left:8%;bottom:12%;animation-delay:.5s}.fx-estrelas .s4{right:6%;bottom:22%;animation-delay:.75s}
@keyframes brilha{0%,100%{transform:scale(.3) rotate(0);opacity:0}50%{transform:scale(1) rotate(90deg);opacity:1}}
.fx-gota{top:8%;right:8%;width:16%;height:22%;animation:escorre 1.2s ease-in infinite}
@keyframes escorre{0%{transform:translateY(0);opacity:1}100%{transform:translateY(60%);opacity:0}}
.fx-exc{top:-12%;left:50%;transform:translateX(-50%);font-family:Bungee,sans-serif;color:var(--am);font-size:calc(var(--t,20vh) * .3);animation:piscaTxt .5s infinite}

/* ---------- CARTA ---------- */
.carta{width:var(--cw,220px);height:calc(var(--cw,220px) * 1.42);position:relative;transform-style:preserve-3d;transition:transform .8s;border:0;padding:0;background:none;cursor:default;display:block}
button.carta{cursor:pointer}
.carta .verso,.carta .frente{position:absolute;inset:0;border-radius:18px;-webkit-backface-visibility:hidden;backface-visibility:hidden;border:5px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 40px rgba(255,46,136,.55)}
.carta .verso{background:repeating-linear-gradient(45deg,#FF2E88 0 14px,#E0136F 14px 28px)}
.carta .verso span{width:70%;height:70%;border-radius:14px;background:#0A0A0F;display:flex;align-items:center;justify-content:center;font-family:Bungee,sans-serif;font-size:calc(var(--cw,220px) * .4);color:var(--rosa)}
.carta .frente{background:#fff;color:#0A0A0F;transform:rotateY(180deg);flex-direction:column;gap:6px;font-family:Bungee,sans-serif;font-size:calc(var(--cw,220px) * .14);text-align:center;border-color:var(--rosa)}
.carta.aberta{transform:rotateY(180deg)}
.carta.abrindo{animation:abre 1.1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes abre{from{transform:rotateY(0) scale(.8)}to{transform:rotateY(900deg) scale(1)}}
.carta.flutua{animation:flutua 1s ease-in-out infinite}
@keyframes flutua{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.06)}}

/* ---------- HOME ---------- */
.home{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;padding:32px}
.home h1{font-family:Bungee,sans-serif;font-size:clamp(40px,7vw,80px);margin:0;color:var(--am);font-weight:400}
.home h1 b{color:var(--rosa);font-weight:400}
.home .opcoes{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.home a{display:flex;flex-direction:column;gap:8px;width:240px;padding:28px;border-radius:20px;background:var(--card);border:2px solid var(--linha);color:#fff;text-decoration:none}
.home a:hover{border-color:var(--am)}
.home a b{font-family:Bungee,sans-serif;font-weight:400;font-size:24px;color:var(--am)}
.home a span{color:var(--sub);font-size:15px}

/* ---------- TV ---------- */
.tv{height:100vh;overflow:hidden;display:flex;flex-direction:column;padding:2.6vh 3.5vw;gap:1.6vh;position:relative}
.tv-top{display:flex;justify-content:space-between;align-items:center}
.tv-top .nm{display:flex;flex-direction:column;gap:.4vh}
.tv-top .nm b{font-family:Bungee,sans-serif;font-weight:400;font-size:3.6vh}
.tv-top .nm span{font-size:1.8vh;color:var(--sub)}
.tv-top .nm.a b{color:var(--a)}.tv-top .nm.b{text-align:right}.tv-top .nm.b b{color:var(--b)}
.rodada{text-align:center;display:flex;flex-direction:column;gap:.4vh}
.rodada b{font-family:Bungee,sans-serif;font-weight:400;font-size:2.8vh;color:var(--am)}
.rodada span{font-size:1.8vh;letter-spacing:.4vh;color:var(--sub)}
.arena{flex:1;min-height:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 3vw}
.lado{display:flex;flex-direction:column;align-items:center;gap:1.4vh;min-width:26vw}
.degraus{display:flex;gap:.5vh}
.degraus i{width:1.6vh;height:2.6vh;border-radius:.4vh;background:var(--linha);transition:background .4s}
.centro{position:relative;width:36vh;height:36vh;align-self:center;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.centro .miolo{position:relative;display:flex;flex-direction:column;align-items:center;gap:.6vh;text-align:center}
.centro .num{font-family:Bungee,sans-serif;font-size:19vh;line-height:1;color:var(--am)}
.centro .num.urgente{color:#FF4D6D}
.centro .rot{font-size:2vh;letter-spacing:.5vh;color:var(--sub)}
.modo-desafio .centro .num{color:var(--rosa)}
.painel{background:var(--card);border:2px solid var(--linha);border-radius:2.6vh;padding:2.4vh 3vh;display:flex;flex-direction:column;gap:1.6vh}
.modo-desafio .painel{background:rgba(30,6,18,.9);border-color:var(--rosa)}
.painel .q{font-size:3.8vh;font-weight:800;line-height:1.2}
.alts{display:grid;grid-template-columns:1fr 1fr;gap:1.2vh;font-size:2.5vh}
.alts span{background:var(--card2);border-radius:1.4vh;padding:1.2vh 1.6vh;display:flex;gap:1.2vh;align-items:center}
.alts span b{color:var(--am);font-family:Bungee,sans-serif;font-weight:400}
.alts span.certa{background:var(--ok);color:#0A0A0F;font-weight:800}
.alts span.certa b{color:#0A0A0F}
.alts em{margin-left:auto;font-style:normal;font-size:1.6vh;font-weight:800;padding:.3vh 1vh;border-radius:99px;background:#0A0A0F}
.status{display:flex;justify-content:space-between;font-size:1.9vh;font-weight:600;letter-spacing:.1vh}
.banner{align-self:center;background:var(--rosa);color:#0A0A0F;font-family:Bungee,sans-serif;font-size:4.4vh;padding:1vh 3vh;border-radius:1.6vh;text-align:center}
.tela-cheia{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:4vh 4vw;gap:2vh;z-index:5}
.tela-cheia:empty{display:none}
.tela-cheia h1{font-family:Bungee,sans-serif;font-weight:400;font-size:8vh;margin:0;color:var(--am);text-align:center}
.tela-cheia h1 b{color:var(--rosa);font-weight:400}
.slots{flex:1;width:100%;display:flex;justify-content:space-between;align-items:center}
.slot{width:28vw;display:flex;flex-direction:column;align-items:center;gap:1.2vh}
.slot .vazio{width:24vh;height:24vh;border-radius:50%;border:.5vh dashed #3A3A4A;display:flex;align-items:center;justify-content:center;font-family:Bungee,sans-serif;font-size:9vh;color:#3A3A4A}
.codigo{display:flex;flex-direction:column;align-items:center;gap:1vh;background:var(--card);border:2px solid var(--linha);border-radius:3vh;padding:3.5vh 5vh}
.codigo b{font-family:Bungee,sans-serif;font-weight:400;font-size:15vh;line-height:1;letter-spacing:1vh}
.confete{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confete i{position:absolute;top:-5vh;width:1.2vh;height:2.2vh;border-radius:.3vh;animation:cai linear infinite}
@keyframes cai{to{transform:translateY(115vh) rotate(720deg)}}

/* ---------- EQUIPE ---------- */
.eq{min-height:100vh;padding:28px clamp(16px,4vw,56px);display:flex;flex-direction:column;gap:22px;max-width:1280px;margin:0 auto}
.eq h2{font-family:Bungee,sans-serif;font-weight:400;margin:0;font-size:clamp(26px,3.6vw,42px)}
.campos{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:20px;align-items:end}
.campo{display:flex;flex-direction:column;gap:8px}
.lado-btn{display:flex;gap:8px}
.lado-btn button{flex:1;border-radius:12px;padding:14px;font-weight:800;font-size:17px;cursor:pointer;background:var(--card);border:2px solid var(--linha);color:#fff}
.lado-btn button.sel.a{background:var(--a);color:#0A0A0F;border-color:var(--a)}
.lado-btn button.sel.b{background:var(--b);color:#0A0A0F;border-color:var(--b)}
.grade-av{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.grade-av button{background:var(--card);border:3px solid var(--linha);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;color:#fff;font-weight:600;font-size:15px}
.grade-av button.sel{border-color:var(--am);background:#26230F}
.grade-av .av{--t:min(14vw,130px)}
.topo-eq{display:flex;justify-content:space-between;align-items:center;gap:16px}
.topo-eq .quem{display:flex;align-items:center;gap:14px}
.topo-eq .quem .av{--t:72px}
.topo-eq .quem b{font-family:Bungee,sans-serif;font-weight:400;font-size:24px;display:block}
.topo-eq .quem span{font-size:14px;color:var(--sub)}
.timer-eq{font-family:Bungee,sans-serif;font-size:72px;line-height:1;color:var(--am)}
.modo-desafio .timer-eq{color:var(--rosa)}
.btn-desafio{display:flex;align-items:center;gap:10px;background:var(--rosa);color:#0A0A0F;border:0;border-radius:16px;padding:12px 20px;font-family:Bungee,sans-serif;font-size:19px;cursor:pointer;min-height:56px}
.btn-desafio:disabled{opacity:.35;cursor:not-allowed}
.btn-desafio em{font-family:Inter,sans-serif;font-style:normal;font-weight:800;font-size:13px;background:#0A0A0F;color:var(--rosa);border-radius:99px;padding:3px 9px}
.pergunta-eq{font-size:clamp(24px,3vw,38px);font-weight:800;line-height:1.25}
.alts-eq{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.alts-eq button{background:var(--card);border:2px solid var(--linha);border-radius:18px;padding:22px 26px;display:flex;align-items:center;gap:18px;font-size:clamp(17px,2vw,23px);font-weight:600;color:#fff;cursor:pointer;min-height:100px;text-align:left}
.alts-eq button b{font-family:Bungee,sans-serif;font-weight:400;font-size:32px;color:var(--am);min-width:40px}
.alts-eq button:hover:not(:disabled){border-color:var(--am)}
.alts-eq button:disabled{cursor:default;opacity:.55}
.alts-eq button.minha{opacity:1;border-color:var(--am);background:#26230F}
.alts-eq button.certa{opacity:1;background:var(--ok);color:#0A0A0F;border-color:var(--ok)}
.alts-eq button.certa b{color:#0A0A0F}
.modo-desafio .alts-eq button{background:#1E0612;border-color:var(--rosa)}
.modo-desafio .alts-eq button b{color:var(--rosa)}
.centro-eq{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.centro-eq .av{--t:min(34vh,300px)}
.grande{font-family:Bungee,sans-serif;font-weight:400;font-size:clamp(30px,4.4vw,56px);margin:0}
.sub{color:var(--sub);font-size:18px}
.cartas3{display:flex;gap:44px;align-items:center;justify-content:center;flex-wrap:wrap}
.cartas3 .carta{--cw:min(19vw,230px);transition:transform .25s}
.cartas3 .carta:nth-child(1){transform:rotate(-7deg)}.cartas3 .carta:nth-child(2){transform:translateY(-22px)}.cartas3 .carta:nth-child(3){transform:rotate(7deg)}
.cartas3 .carta:hover{transform:scale(1.08) translateY(-10px)}
.link{background:none;border:0;color:var(--sub);text-decoration:underline;font-size:16px;font-weight:600;cursor:pointer;padding:10px}
.aviso-env{background:var(--card);border:2px solid var(--am);border-radius:16px;padding:14px 18px;text-align:center;font-weight:800;font-size:18px}

body.espiao #eqTela{pointer-events:none}
/* imagens das perguntas */
.com-img{display:flex;gap:2.4vh;align-items:center}
.com-img .qimg{height:24vh;max-width:34vw;object-fit:contain;border-radius:1.6vh;background:#fff;flex-shrink:0}
.com-img .qcol{flex:1;display:flex;flex-direction:column;gap:1.6vh;min-width:0}
.perg-img{display:flex;gap:22px;align-items:center}
.perg-img img{max-height:30vh;max-width:45%;object-fit:contain;border-radius:16px;background:#fff;flex-shrink:0}
.miniimg{width:44px;height:44px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-right:8px;background:#fff}
.prev-img{max-width:100%;max-height:180px;object-fit:contain;border-radius:12px;background:#fff;align-self:flex-start}
/* ---------- ADMIN ---------- */
.espiar-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.espiar-box{display:flex;flex-direction:column;gap:8px}
.espiar-frame{position:relative;width:100%;aspect-ratio:16/10;border:2px solid var(--linha);border-radius:14px;overflow:hidden;background:#000}
.espiar-frame iframe{position:absolute;top:0;left:0;width:1280px;height:800px;border:0;transform-origin:0 0}
.adm{max-width:1280px;margin:0 auto;padding:28px clamp(16px,3vw,40px);display:flex;flex-direction:column;gap:20px}
.adm-topo{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.adm-topo h1{font-family:Bungee,sans-serif;font-weight:400;font-size:28px;margin:0;color:var(--am)}
.adm-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:22px;align-items:start}
.caixa{background:var(--card);border:2px solid var(--linha);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.caixa h2{margin:0;font-size:18px}
.filtros{display:flex;gap:8px;flex-wrap:wrap}
.filtros button{background:none;border:1.5px solid var(--linha);color:#fff;border-radius:99px;padding:6px 14px;font-weight:800;font-size:13px;cursor:pointer}
.filtros button.sel{border-color:var(--am);color:var(--am)}
.linha-q{display:grid;grid-template-columns:86px 92px 1fr auto;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--linha);font-size:15px}
.tag{font-size:11px;font-weight:800;border:1.5px solid;border-radius:99px;padding:3px 9px;text-align:center}
.tag.n{color:var(--am)}.tag.d{color:var(--rosa)}
.linha-q .acoes{display:flex;gap:6px}
.linha-q .acoes button{background:var(--card2);border:1px solid var(--linha);color:#fff;border-radius:8px;padding:7px 10px;cursor:pointer;font-size:13px;font-weight:600}
.alt-linha{display:flex;align-items:center;gap:10px}
.alt-linha input[type=radio]{width:22px;height:22px;accent-color:var(--ok);flex-shrink:0}
.alt-linha b{font-family:Bungee,sans-serif;font-weight:400;color:var(--am);width:18px}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.login{max-width:420px;margin:12vh auto;padding:0 20px}
@media (max-width:900px){.adm-grid,.campos{grid-template-columns:1fr}.grade-av{grid-template-columns:repeat(3,1fr)}.alts-eq{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================
   CONFIGURAÇÃO — cole aqui os dados do seu projeto Supabase
   (Supabase > Project Settings > API)
   ========================================================= */

function abrirCanal(sala, aoReceber){
  return new Promise(function(ok){
    var ch = sb.channel('exe-' + sala, { config: { broadcast: { self: false } } });
    ch.on('broadcast', { event: 'msg' }, function(r){ aoReceber(r.payload); });
    ch.subscribe(function(st){ if (st === 'SUBSCRIBED') ok(ch); });
  });
}

else if (modo.indexOf('espiar-') === 0) initEspiar(modo.split('-')[1], modo.split('-')[2]);

   TV — comanda o jogo (nada é salvo)
   ========================================================= */
var S, chTV, banco = { normal: [], desafio: [] }, filaPerg = [], usadosDesafio = {}, sigCentro = '', sigPainel = '', sigCheia = '';
function mk(r){ return { id: r.id, tema: r.tema, texto: r.pergunta, img: r.imagem_url || null, alts: r.alternativas, correta: r.correta }; }

function initTV(){
  document.body.classList.add('tv-mode');
  $('#app').innerHTML = '<div class="home"><h1 class="pisca">CARREGANDO…</h1></div>';
  sb.from('perguntas').select('*').then(function(res){
    if (res.error) { $('#app').innerHTML = '<div class="home"><div class="erro">Erro ao buscar perguntas: '+esc(res.error.message)+'</div></div>'; return; }
    var rows = res.data || [];
    banco.normal = rows.filter(function(p){ return p.tipo === 'normal'; });
    banco.desafio = rows.filter(function(p){ return p.tipo === 'desafio'; });
    if (!banco.normal.length) { $('#app').innerHTML = '<div class="home"><div class="erro">Nenhuma pergunta normal cadastrada. Cadastre pela tela Admin.</div><a class="btn" href="#admin" style="text-decoration:none">Ir para o Admin</a></div>'; return; }
    filaPerg = shuffle(banco.normal).slice(0, PERGUNTAS_POR_PARTIDA);
    var sala = String(Math.floor(1000 + Math.random() * 9000));
    S = { sala: sala, fase: 'lobby', equipes: { A: null, B: null }, idx: -1, total: filaPerg.length, pergunta: null,
          respostas: { A: null, B: null }, resultado: null, tempo: 0, desafio: null, temDesafio: banco.desafio.length > 0 };
    montarTV();
    abrirCanal(sala, onMsgTV).then(function(ch){ chTV = ch; publicar(); setInterval(tick, 1000); });
    renderTV();
  });
}

function pub(){
  var s = JSON.parse(JSON.stringify(S));
  if (s.pergunta && s.fase !== 'revelacao') delete s.pergunta.correta;
  if (s.desafio && s.desafio.pergunta) {
    var et = s.desafio.etapa;
    if (et !== 'lendo' && et !== 'respondendo' && et !== 'resultado') s.desafio.pergunta = null;
    else if (et !== 'resultado') delete s.desafio.pergunta.correta;
  }
  return s;
}
function publicar(){ if (chTV) enviar(chTV, { t: 'estado', s: pub() }); renderTV(); }

function onMsgTV(m){
  var d = S.desafio, eq;
  if (m.t === 'ola') { publicar(); }
  else if (m.t === 'entrar') {
    var atual = S.equipes[m.equipe];
    if (atual && atual.cid !== m.cid && atual.nome.toLowerCase() !== String(m.nome).toLowerCase()) {
      enviar(chTV, { t: 'recusado', cid: m.cid, motivo: 'Esse lado já está com a equipe ' + atual.nome + '. Escolha o outro lado.' }); return;
    }
    if (!atual && S.fase !== 'lobby') { enviar(chTV, { t: 'recusado', cid: m.cid, motivo: 'O jogo já começou.' }); return; }
    if (atual) atual.cid = m.cid;
    else S.equipes[m.equipe] = { nome: String(m.nome).slice(0, 16), avatar: AV[m.avatar] ? m.avatar : 'lobo', degrau: DEGRAU_INICIAL, desafioUsado: false, cid: m.cid };
    if (S.fase === 'lobby' && S.equipes.A && S.equipes.B) { S.fase = 'contagem'; S.tempo = 5; }
    publicar();
  }
  else if (m.t === 'responder') {
    if (S.fase === 'pergunta' && !d && m.idx === S.idx && S.respostas[m.equipe] === null) {
      S.respostas[m.equipe] = m.alt;
      if (S.respostas.A !== null && S.respostas.B !== null) revelar(); else publicar();
    }
  }
  else if (m.t === 'desafiar') {
    eq = S.equipes[m.equipe];
    if (!eq || eq.desafioUsado || d || (S.fase !== 'pergunta' && S.fase !== 'revelacao')) return;
    var disp = banco.desafio.filter(function(p){ return !usadosDesafio[p.id]; });
    if (!disp.length) return;
    S.desafio = { de: m.equipe, para: OUTRA(m.equipe), etapa: 'escolhendo', cartas: shuffle(disp).slice(0, 3).map(function(p){ return p.id; }), pergunta: null, tempo: 0, resposta: null, acertou: null };
    publicar();
  }
  else if (m.t === 'cancelar_desafio') {
    if (d && d.etapa === 'escolhendo' && d.de === m.equipe) { S.desafio = null; publicar(); }
  }
  else if (m.t === 'escolher_carta') {
    if (!d || d.etapa !== 'escolhendo' || d.de !== m.equipe) return;
    var id = d.cartas[m.n], r = null;
    banco.desafio.forEach(function(p){ if (p.id === id) r = p; });
    if (!r) return;
    usadosDesafio[id] = true; S.equipes[d.de].desafioUsado = true;
    d.pergunta = mk(r); d.etapa = 'carta'; publicar();
  }
  else if (m.t === 'abrir_carta') {
    if (d && d.etapa === 'carta' && d.para === m.equipe) { d.etapa = 'lendo'; d.tempo = TEMPO_LER_DESAFIO; publicar(); }
  }
  else if (m.t === 'responder_desafio') {
    if (d && d.etapa === 'respondendo' && d.para === m.equipe && d.resposta === null) { d.resposta = m.alt; fecharDesafio(); }
  }
}

function revelar(){
  S.fase = 'revelacao'; S.tempo = TEMPO_REVELACAO; S.resultado = {};
  ['A','B'].forEach(function(e){
    var ok = S.respostas[e] === S.pergunta.correta;
    S.resultado[e] = ok;
    if (ok) S.equipes[e].degrau = clamp(S.equipes[e].degrau + 1, DEGRAU_MIN, DEGRAU_MAX);
  });
  publicar();
}
function fecharDesafio(){
  var d = S.desafio, eq = S.equipes[d.para];
  d.acertou = d.resposta === d.pergunta.correta;
  eq.degrau = clamp(eq.degrau + (d.acertou ? 3 : -3), DEGRAU_MIN, DEGRAU_MAX);
  d.etapa = 'resultado'; d.tempo = TEMPO_RESULT_DESAFIO; publicar();
}
function proxima(){
  S.idx++;
  if (S.idx >= filaPerg.length) { S.fase = 'final'; S.pergunta = null; publicar(); return; }
  S.pergunta = mk(filaPerg[S.idx]); S.respostas = { A: null, B: null }; S.resultado = null;
  S.fase = 'pergunta'; S.tempo = TEMPO_PERGUNTA; publicar();
}
function tick(){
  var d = S.desafio;
  if (d) {
    if (d.etapa === 'lendo' || d.etapa === 'respondendo' || d.etapa === 'resultado') {
      d.tempo--;
      if (d.tempo <= 0) {
        if (d.etapa === 'lendo') { d.etapa = 'respondendo'; d.tempo = TEMPO_RESP_DESAFIO; }
        else if (d.etapa === 'respondendo') { fecharDesafio(); return; }
        else { S.desafio = null; }
      }
      publicar();
    }
    return; // jogo congelado durante o desafio
  }
  if (S.fase === 'contagem') { S.tempo--; if (S.tempo <= 0) { proxima(); return; } publicar(); }

      else if (d.etapa === 'respondendo') {
        var travou = E.minhaD !== undefined;
        h = '<div class="topo-eq"><span class="bung" style="color:var(--rosa);font-size:22px">PERGUNTA DESAFIO</span><span class="timer-eq pisca" id="tempoEq">'+tempo+'</span></div>'+pergEq(d.pergunta)+altsEq(d.pergunta.alts,'respd',travou,travou?E.minhaD:-1,-1)+(travou?'<div class="aviso-env">Resposta enviada!</div>':'');
      } else {
        h = '<div class="centro-eq">'+avatarHTML(me.avatar,0,d.acertou?'feliz':'triste')+'<p class="grande" style="color:'+(d.acertou?'var(--ok)':'#FF4D6D')+'">'+(d.acertou?'ACERTARAM! +3 DEGRAUS':'NÃO FOI DESSA VEZ · −3')+'</p></div>'+altsEq(d.pergunta.alts,'x',true,-1,d.pergunta.correta);
      }
    }
  } else if (s.fase === 'pergunta') {
    var minha = s.respostas[eu] !== null ? s.respostas[eu] : E.minha[s.idx], respondeu = minha !== undefined && minha !== null;
    h = topo(true, true) + pergEq(s.pergunta) + altsEq(s.pergunta.alts, 'resp', respondeu, respondeu?minha:-1, -1)
      + (respondeu ? '<div class="aviso-env">Resposta enviada! Aguardando '+nOut+'…</div>' : '<p class="sub" style="text-align:center;margin:0">Toque na alternativa para responder. A resposta vai direto.</p>');
  } else if (s.fase === 'revelacao') {
    var ok = s.resultado[eu];
    h = topo(false, true) + '<div style="display:flex;align-items:center;gap:20px;justify-content:center">'+avatarHTML(me.avatar,0,ok?'feliz':'triste','120px')+'<p class="grande" style="color:'+(ok?'var(--ok)':'#FF4D6D')+'">'+(ok?'ACERTARAM! +1':'NÃO FOI DESSA VEZ')+'</p></div>'
      + pergEq(s.pergunta) + altsEq(s.pergunta.alts, 'x', true, s.respostas[eu] === null ? -1 : s.respostas[eu], s.pergunta.correta)
      + '<p class="sub" style="text-align:center;margin:0">Próxima pergunta em <b class="bung" id="tempoEq" style="color:var(--am)">'+tempo+'</b></p>';
  }
  $('#eqTela').innerHTML = h;
  if (!d) E.minhaD = undefined;
}

/* =========================================================
   ADMIN — banco de perguntas (fica salvo no Supabase)
   ========================================================= */
var ADM = { lista: [], filtro: 'todas', editando: null };
function initAdmin(){
  sb.auth.getSession().then(function(r){ if (r.data && r.data.session) painelAdmin(); else loginAdmin(); });
}
function loginAdmin(msg){
  $('#app').innerHTML = '<form class="login caixa" id="fLogin"><h2 class="bung" style="color:var(--am);font-weight:400;font-size:24px">ADMIN · ENTRAR</h2>'+(msg?'<div class="erro">'+esc(msg)+'</div>':'')
    + '<div class="campo"><label for="em">E-mail</label><input id="em" type="email" required autocomplete="username"></div>'
    + '<div class="campo"><label for="se">Senha</label><input id="se" type="password" required autocomplete="current-password"></div>'
    + '<button class="btn">Entrar</button><a href="#" style="color:var(--sub);text-align:center">Voltar</a></form>';
  $('#fLogin').addEventListener('submit', function(ev){
    ev.preventDefault();
    sb.auth.signInWithPassword({ email: $('#em').value, password: $('#se').value }).then(function(r){
      if (r.error) loginAdmin('E-mail ou senha incorretos.'); else painelAdmin();
    });
  });
}
function painelAdmin(){
  $('#app').innerHTML = '<div class="adm"><div class="adm-topo"><div><h1>EQUIPE x EQUIPE · ADMIN</h1><span style="color:var(--sub);font-size:14px">Banco de perguntas (fica salvo). As partidas não ficam salvas.</span></div>'
    + '<div style="display:flex;gap:10px"><a class="btn" href="#tv" target="_blank" style="text-decoration:none;font-family:Bungee,sans-serif;font-weight:400">ABRIR A TV</a><button class="btn sec" id="bSair">Sair</button></div></div>'
    + '<form class="caixa" id="fEspiar"><h2>Acompanhar a partida ao vivo</h2><div style="display:flex;gap:10px;align-items:end;flex-wrap:wrap"><div class="campo" style="width:180px"><label for="codEsp">CÓDIGO DA SALA (aparece na TV)</label><input id="codEsp" inputmode="numeric" maxlength="4" class="bung" style="letter-spacing:5px;font-size:20px"></div><button class="btn">Ver telas das equipes</button><button type="button" class="btn sec" id="bFecharEsp" style="display:none">Fechar</button></div><div id="espiarArea"></div></form>'
    + '<div id="contagem" style="color:var(--sub)"></div><div class="adm-grid"><div class="caixa" id="lista"></div><form class="caixa" id="fPerg"></form></div></div>';
  $('#bSair').onclick = function(){ sb.auth.signOut().then(function(){ loginAdmin(); }); };
  $('#lista').addEventListener('click', function(ev){
    var b = ev.target.closest('button'); if (!b) return;
    if (b.getAttribute('data-f')) { ADM.filtro = b.getAttribute('data-f'); renderLista(); }
    var id = b.getAttribute('data-ed'); if (id) { ADM.editando = ADM.lista.filter(function(p){ return p.id === id; })[0]; renderForm(); window.scrollTo(0,0); }
    id = b.getAttribute('data-del');
    if (id && confirm('Excluir esta pergunta?')) sb.from('perguntas').delete().eq('id', id).then(function(r){ if (r.error) alert(r.error.message); carregar(); });
  });
  $('#fEspiar').onsubmit = function(ev){
    ev.preventDefault();
    var c = $('#codEsp').value.trim(); if (!/^\d{4}$/.test(c)) return;
    var base = location.pathname;
    $('#espiarArea').innerHTML = '<div class="espiar-grid">' + ['A','B'].map(function(e){
      return '<div class="espiar-box"><b style="color:'+corEq(e)+'">Notebook da Equipe '+e+'</b><div class="espiar-frame"><iframe title="Tela da Equipe '+e+'" src="'+base+'#espiar-'+c+'-'+e+'"></iframe></div></div>'; }).join('') + '</div>';
    $('#bFecharEsp').style.display = '';
    ajustarEspiar();
  };
  $('#bFecharEsp').onclick = function(){ $('#espiarArea').innerHTML = ''; this.style.display = 'none'; };
  window.addEventListener('resize', ajustarEspiar);
  renderForm(); carregar();
}
function ajustarEspiar(){
  document.querySelectorAll('.espiar-frame').forEach(function(f){ var i = f.querySelector('iframe'); if (i) i.style.transform = 'scale(' + (f.clientWidth / 1280) + ')'; });
}
function carregar(){
  sb.from('perguntas').select('*').order('created_at', { ascending: false }).then(function(r){
    if (r.error) { $('#lista').innerHTML = '<div class="erro">'+esc(r.error.message)+'</div>'; return; }
    ADM.lista = r.data || []; renderLista();
  });
}
function renderLista(){
  var n = ADM.lista.filter(function(p){ return p.tipo === 'normal'; }).length, dd = ADM.lista.length - n;
  $('#contagem').innerHTML = '<b style="color:var(--am)">'+n+'</b> normais · <b style="color:var(--rosa)">'+dd+'</b> desafio'
    + (n < PERGUNTAS_POR_PARTIDA ? ' · <span style="color:#FFC2CE">cadastre pelo menos '+PERGUNTAS_POR_PARTIDA+' normais para a partida ter '+PERGUNTAS_POR_PARTIDA+' perguntas</span>' : '')
    + (dd < 6 ? ' · <span style="color:#FFC2CE">recomendado: pelo menos 6 de desafio (3 cartas para cada equipe)</span>' : '');
  var itens = ADM.lista.filter(function(p){ return ADM.filtro === 'todas' || p.tipo === ADM.filtro; });
  $('#lista').innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2>Perguntas cadastradas</h2><div class="filtros">'
    + [['todas','TODAS'],['normal','NORMAL'],['desafio','DESAFIO']].map(function(f){ return '<button type="button" data-f="'+f[0]+'" class="'+(ADM.filtro===f[0]?'sel':'')+'">'+f[1]+'</button>'; }).join('') + '</div></div>'
    + (itens.length ? itens.map(function(p){
        return '<div class="linha-q"><span class="tag '+(p.tipo==='normal'?'n':'d')+'">'+p.tipo.toUpperCase()+'</span><span style="color:var(--sub)">'+(p.tema==='seguranca'?'Segurança':'Processo')+'</span>'
          + '<span>'+(p.imagem_url?'<img class="miniimg" src="'+esc(p.imagem_url)+'" alt="">':'')+esc(p.pergunta)+' <b style="color:var(--ok)">('+LET[p.correta]+')</b></span><span class="acoes"><button type="button" data-ed="'+p.id+'">Editar</button><button type="button" data-del="'+p.id+'">Excluir</button></span></div>'; }).join('')
      : '<p style="color:var(--sub)">Nenhuma pergunta ainda.</p>');
}
// reduz a foto (máx. 1280px) antes de enviar, para carregar rápido na TV
function subirImagem(f){
  if (!f) return Promise.resolve(null);
  return new Promise(function(ok, erro){
    var img = new Image();
    img.onload = function(){
      var esc2 = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * esc2); c.height = Math.round(img.height * esc2);
      var cx = c.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, c.width, c.height); cx.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(function(blob){
        var nome = Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
        sb.storage.from('imagens').upload(nome, blob, { contentType: 'image/jpeg' }).then(function(r){
          if (r.error) { erro(r.error); return; }
          ok(sb.storage.from('imagens').getPublicUrl(nome).data.publicUrl);
        });
      }, 'image/jpeg', 0.85);
    };
    img.onerror = function(){ erro(new Error('arquivo de imagem inválido')); };
    img.src = URL.createObjectURL(f);
  });
}
function renderForm(){
  var p = ADM.editando || { tipo: 'normal', tema: 'processo', pergunta: '', alternativas: ['', '', '', ''], correta: 0 };
  $('#fPerg').innerHTML = '<h2>'+(ADM.editando ? 'Editar pergunta' : 'Nova pergunta')+'</h2>'
    + '<div class="dupla"><div class="campo"><label for="ti">Tipo</label><select id="ti"><option value="normal">Normal (20s)</option><option value="desafio">Desafio (3s + 8s)</option></select></div>'
    + '<div class="campo"><label for="te">Tema</label><select id="te"><option value="processo">Processo</option><option value="seguranca">Segurança do trabalho</option></select></div></div>'
    + '<div class="campo"><label for="pe">Pergunta</label><textarea id="pe" rows="3" required style="resize:vertical">'+esc(p.pergunta)+'</textarea></div>'
    + '<div class="campo"><label for="im">Imagem (opcional)</label><input id="im" type="file" accept="image/*"><div id="prevImg" style="display:flex;flex-direction:column;gap:8px">'+(p.imagem_url?'<img class="prev-img" src="'+esc(p.imagem_url)+'" alt="Imagem atual"><button type="button" class="btn sec" id="bTiraImg">Remover imagem</button>':'')+'</div></div>'
    + '<label>Alternativas (marque a certa)</label>'
    + [0,1,2,3].map(function(i){ return '<div class="alt-linha"><input type="radio" name="ce" value="'+i+'" id="ce'+i+'" '+(p.correta===i?'checked':'')+'><label for="ce'+i+'"><b>'+LET[i]+'</b></label><input id="al'+i+'" required aria-label="Alternativa '+LET[i]+'" value="'+esc(p.alternativas[i]||'')+'"></div>'; }).join('')
    + '<div id="msgF"></div><button class="btn verde">'+(ADM.editando ? 'Salvar alterações' : 'Salvar pergunta')+'</button>'
    + (ADM.editando ? '<button type="button" class="btn sec" id="bCanc">Cancelar edição</button>' : '');
  $('#ti').value = p.tipo; $('#te').value = p.tema;
  ADM.imgAtual = p.imagem_url || null; ADM.arquivo = null;
  $('#im').onchange = function(){
    var f = this.files[0]; ADM.arquivo = f || null;
    $('#prevImg').innerHTML = f ? '<img class="prev-img" src="'+URL.createObjectURL(f)+'" alt="Prévia">' : '';
  };
  if ($('#bTiraImg')) $('#bTiraImg').onclick = function(){ ADM.imgAtual = null; $('#prevImg').innerHTML = '<span style="color:var(--sub)">A imagem será removida ao salvar.</span>'; };
  if ($('#bCanc')) $('#bCanc').onclick = function(){ ADM.editando = null; renderForm(); };
  $('#fPerg').onsubmit = function(ev){
    ev.preventDefault();
    var dados = { tipo: $('#ti').value, tema: $('#te').value, pergunta: $('#pe').value.trim(),
      alternativas: [0,1,2,3].map(function(i){ return $('#al'+i).value.trim(); }), correta: +document.querySelector('input[name=ce]:checked').value };
    var bt = ev.target.querySelector('.btn.verde'); bt.disabled = true; bt.textContent = 'Salvando…';
    var falha = function(msg){ $('#msgF').innerHTML = '<div class="erro">'+esc(msg)+'</div>'; bt.disabled = false; bt.textContent = 'Salvar'; };
    subirImagem(ADM.arquivo).then(function(url){
      dados.imagem_url = ADM.arquivo ? url : ADM.imgAtual;
      var q = ADM.editando ? sb.from('perguntas').update(dados).eq('id', ADM.editando.id) : sb.from('perguntas').insert(dados);
      return q.then(function(r){
        if (r.error) { falha(r.error.message); return; }
        ADM.editando = null; renderForm(); carregar();
      });
    }).catch(function(e){ falha('Erro ao enviar a imagem: ' + (e && e.message ? e.message : e)); });
  };
}
iniciar();
</script>
